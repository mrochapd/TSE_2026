# Temporário: confere se o total do exterior pode ser calculado como Brasil − soma dos estados.
name: Diagnóstico TSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir cálculo do exterior
        run: |
          B=https://resultados.tse.jus.br/oficial/ele2026/6258/dados
          C=e006258
          curl -sS $B/br/br-c0001-$C-u.json -o br.json
          curl -sS $B/br/br-$C-ab.json -o ab.json
          for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pe pi rj rn rs ro rr sc sp se to; do
            curl -sS $B/$uf/$uf-c0001-$C-u.json -o uf-$uf.json
          done
          echo "--- estados com seções apuradas (arquivo x índice):"
          for f in uf-*.json; do uf=${f#uf-}; uf=${uf%.json}
            jq -r --arg uf $uf --slurpfile ab ab.json '"\($uf): arquivo \(.s.st) | índice \($ab[0].abr[] | select(.cdabr == $uf) | .s.st) | gerado \(.dg) \(.hg)"' $f
          done | grep -v "arquivo 0 | índice 0"
          jq -s '
            def v(n): [.. | objects | select(has("cand")) | .cand[]? | select(.n == n) | .vap | tonumber] | add;
            (.[0]) as $br | (.[1:]) as $ufs |
            { brasil: { st: ($br.s.st|tonumber), lula: ($br|v("13")), flavio: ($br|v("22")) },
              estados: { st: ([$ufs[].s.st|tonumber]|add), lula: ([$ufs[]|v("13")]|add), flavio: ([$ufs[]|v("22")]|add) } }
            | .exterior_calculado = { st: (.brasil.st - .estados.st), lula: (.brasil.lula - .estados.lula), flavio: (.brasil.flavio - .estados.flavio) }
          ' br.json uf-*.json
          echo "--- índice:"; jq -c '{dg, hg}, [.abr[] | select(.cdabr == "zz" or .cdabr == "br") | {cdabr, st: .s.st, c: .e.c}]' ab.json
