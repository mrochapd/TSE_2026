# Temporário: confere se os arquivos do exterior no TSE já têm votos.
name: Diagnóstico TSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir exterior
        run: |
          B=https://resultados.tse.jus.br/oficial/ele2026/6258/dados
          C=e006258
          r() { curl -sS "$1" | jq -c '{dg, hg, st: .s.st, ts: .s.ts, cand: [.. | objects | select(has("cand")) | .cand[]? | {n, vap}]}'; }
          echo "br:"; r $B/br/br-c0001-$C-u.json
          echo "zz:"; r $B/zz/zz-c0001-$C-u.json
          for mu in 30457 29262 29254; do echo "zz$mu:"; r $B/zz/zz$mu-c0001-$C-u.json; done
          echo "índice br:"; curl -sS $B/br/br-$C-ab.json | jq -c '{dg, hg}, [.abr[] | select(.cdabr == "zz" or .cdabr == "br" or .cdabr == "sp") | {cdabr, st: .s.st}]'
          echo "índice zz (cidades com seções apuradas):"; curl -sS $B/zz/zz-$C-ab.json | jq -c '{dg, hg}, ([.abr[] | select((.s.st | tonumber) > 0)] | length)'
