# Temporário: baixa arquivos do TSE para conferir o formato dos dados do exterior.
name: Diagnóstico TSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e resumir arquivos
        run: |
          B=https://resultados.tse.jus.br/oficial
          E=6258; C=e006258
          baixar() { echo; echo "=== $1"; code=$(curl -sS -A "Mozilla/5.0" -o "$2" -w "%{http_code}" "$1"); echo "HTTP $code  bytes $(wc -c < "$2")"; }
          resumo() { jq -c '{chaves: keys, dg, hg, dt, ht, and, s, e, v, cand: [.. | objects | select(has("cand")) | .cand[]? | {n, nmu, nm, vap, pvap, sqcand, st, e}]}' "$1" 2>&1 | head -c 2500; echo; }

          curto() { jq -c '{dg, hg, and, s: {ts: .s.ts, st: .s.st}, e: {te: .e.te, c: .e.c}, v: {vv: .v.vv}, cand: [.. | objects | select(has("cand")) | .cand[]? | {n, vap}]}' "$1" 2>&1 | head -c 600; echo; }
          for i in 1 2; do
            baixar $B/ele2026/$E/dados/br/br-c0001-$C-u.json br.json; curto br.json
            baixar $B/ele2026/$E/dados/zz/zz-c0001-$C-u.json zz.json; curto zz.json
            baixar "$B/ele2026/$E/dados/zz/zz-c0001-$C-u.json?t=$(date +%s)" zzq.json; curto zzq.json
            baixar $B/ele2026/$E/dados/zz/zz30457-c0001-$C-u.json ams.json; curto ams.json
            baixar $B/ele2026/$E/dados/sp/sp-c0001-$C-u.json sp.json; curto sp.json
            baixar $B/ele2026/$E/dados/zz/zz-$C-ab.json zzab.json
            echo "cidades do exterior com seções apuradas no índice:"; jq -c '[.abr[] | select((.s.st | tonumber) > 0) | {cdabr, st: .s.st, ts: .s.ts, c: .e.c}] | length, .[0:5]' zzab.json
            jq -c '{dg, hg}' zzab.json
            baixar $B/ele2026/$E/dados/br/br-$C-ab.json brab.json
            jq -c '{dg, hg}, [.abr[] | select(.cdabr == "zz" or .cdabr == "br" or .cdabr == "sp") | {cdabr, and, dt, ht, st: .s.st, ts: .s.ts, c: .e.c}]' brab.json
            sleep 20
          done
          baixar $B/ele2026/$E/fotos/br/280002542548.jpeg foto.jpg; file foto.jpg
          echo "--- cabeçalhos CORS do arquivo do exterior:"
          curl -sS -I -H "Origin: https://mrochapd.github.io" $B/ele2026/$E/dados/zz/zz-c0001-$C-u.json | grep -i -E "^(HTTP|access-control|cache-control|content-type)"
